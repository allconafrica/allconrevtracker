name: Sync Nextcloud Drawings

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Sync Script
        env:
          NC_URL: ${{ secrets.NC_URL }}
          NC_USER: ${{ secrets.NC_USER }}
          NC_PASS: ${{ secrets.NC_PASS }}
        run: python sync_drawings.py

      - name: Commit and push updated drawing data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drawing-data.json
          git commit -m "Auto-sync drawing revisions from Nextcloud [skip ci]" || exit 0
          git push
