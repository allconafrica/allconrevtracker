<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALLCON | Drawing Revision & Alert Hub</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { font-size: 1.1rem; letter-spacing: 1px; margin: 0; color: var(--accent-red); }
        .status-badge { background: rgba(52, 199, 89, 0.15); color: var(--accent-green); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .metric-card h3 { margin: 0 0 10px 0; font-size: 0.75rem; color: var(--text-muted); }
        .metric-card .value { font-size: 2rem; font-weight: 700; }
        
        .project-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
        .project-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #252525; cursor: pointer; user-select: none; }
        .project-header:hover { background: #2a2a2a; }
        .project-path { font-family: monospace; font-size: 0.9rem; color: var(--accent-red); font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .toggle-icon { font-size: 0.8rem; transition: transform 0.3s; }
        .project-section.collapsed .toggle-icon { transform: rotate(-90deg); }
        .project-section.collapsed .drawing-table-container { display: none; }
        .badge-filtered { background: var(--accent-green); color: #000; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        
        .drawing-table-container { padding: 0 20px 15px 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding: 10px; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .rev-tag { background: rgba(52, 199, 89, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; }
        
        .new-alert-badge { background: var(--accent-red); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .status-verified { color: var(--accent-green); font-weight: 600; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <h1>ALLCON | DRAWING REVISION & ALERT HUB</h1>
        <div class="status-badge">● Live Feed Connected</div>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <h3>MONITORED AFC PACKAGES</h3>
            <div class="value" id="total-packages">0</div>
        </div>
        <div class="metric-card">
            <h3>TOTAL AFC DRAWINGS INDEXED</h3>
            <div class="value" id="total-drawings">0</div>
        </div>
    </div>

    <div id="content-container">
        <p style="color: var(--text-muted); text-align: center; padding: 40px;">Loading live Nextcloud data...</p>
    </div>

    <script>
        async function loadDrawingData() {
            try {
                const response = await fetch('drawing-data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error();
                renderDashboard(await response.json());
            } catch (err) {
                document.getElementById('content-container').innerHTML = `<p style="color: var(--accent-red); text-align: center; padding: 40px;">Error loading drawing catalog.</p>`;
            }
        }

        function renderDashboard(data) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';
            let totalDrawingsCount = 0;
            document.getElementById('total-packages').innerText = data.length;

            if (data.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 40px;">No AFC packages found.</p>`;
                document.getElementById('total-drawings').innerText = 0;
                return;
            }

            data.forEach(pkg => {
                totalDrawingsCount += pkg.drawings.length;
                const section = document.createElement('div');
                
                // Check if any drawing in this folder is flagged as new
                const hasNewDrawing = pkg.drawings.some(d => d.isNew);
                
                // Collapsed by default unless it has new incoming revisions
                section.className = hasNewDrawing ? 'project-section' : 'project-section collapsed';

                section.innerHTML = `
                    <div class="project-header" onclick="toggleSection(this)">
                        <div class="project-path">
                            <span class="toggle-icon">▼</span> 
                            <span>${pkg.path}</span>
                            ${hasNewDrawing ? '<span class="new-alert-badge">! NEW REVISION</span>' : ''}
                        </div>
                        <div class="badge-filtered">AFC FILTERED</div>
                    </div>
                    <div class="drawing-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Drawing File Name</th>
                                    <th>Revision</th>
                                    <th>Last Modified</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${pkg.drawings.map(d => `
                                    <tr>
                                        <td>
                                            ${d.filename}${d.isNew ? '<span class="new-alert-badge">NEW</span>' : ''}
                                        </td>
                                        <td><span class="rev-tag">${d.rev}</span></td>
                                        <td>${d.uploaded}</td>
                                        <td><span class="status-verified">AFC VERIFIED</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(section);
            });
            document.getElementById('total-drawings').innerText = totalDrawingsCount;
        }

        function toggleSection(headerEl) {
            headerEl.parentElement.classList.toggle('collapsed');
        }

        loadDrawingData();
    </script>
</body>
</html>
