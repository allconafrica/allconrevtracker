<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLCON - Drawing Revision Tracker</title>
    <style>
        :root {
            --obsidian-black: #0d0d0d;
            --obsidian-card: #161616;
            --obsidian-border: #2a2a2a;
            --allcon-red: #d9232a;
            --text-light: #f1f1f1;
            --text-muted: #a0a0a0;
            --input-bg: #1f1f1f;
            --alert-bg: rgba(217, 35, 42, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--obsidian-black); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--obsidian-card); border-bottom: 2px solid var(--allcon-red); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand-subtitle { font-size: 0.8rem; color: var(--allcon-red); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .status-badge { font-size: 0.75rem; padding: 0.35rem 0.75rem; border-radius: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px; background: #212121; border: 1px solid var(--obsidian-border); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); }
        .status-dot.online { background-color: #4caf50; }
        .status-dot.offline { background-color: #f44336; }
        .btn-icon { background: var(--input-bg); border: 1px solid var(--obsidian-border); color: var(--text-light); padding: 0.5rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        
        main { flex-grow: 1; max-width: 1400px; width: 100%; margin: 1.5rem auto; padding: 0 1.5rem; }
        .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .metric-card { background: var(--obsidian-card); border: 1px solid var(--obsidian-border); padding: 1rem 1.25rem; border-radius: 6px; }
        .metric-card.alert { border-left: 4px solid var(--allcon-red); background: var(--alert-bg); }
        .metric-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .metric-value { font-size: 1.6rem; font-weight: 800; color: white; margin-top: 0.2rem; }

        .project-card { background: var(--obsidian-card); border: 1px solid var(--obsidian-border); border-radius: 6px; margin-bottom: 1.25rem; overflow: hidden; }
        .project-card.has-update { border: 1px solid var(--allcon-red); box-shadow: 0 0 15px rgba(217, 35, 42, 0.2); }
        .project-header { padding: 1rem 1.25rem; background: rgba(255, 255, 255, 0.02); border-bottom: 1px solid var(--obsidian-border); display: flex; justify-content: space-between; align-items: center; }
        .project-path { font-size: 0.75rem; color: var(--allcon-red); font-family: monospace; font-weight: 700; }
        .project-name { font-size: 1.1rem; font-weight: 800; color: white; }
        .alert-tag { background: var(--allcon-red); color: white; font-size: 0.7rem; font-weight: 800; padding: 0.2rem 0.6rem; border-radius: 3px; text-transform: uppercase; }

        .drawing-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .drawing-table th { background: rgba(0, 0, 0, 0.3); color: var(--text-muted); text-align: left; padding: 0.6rem 1.25rem; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--obsidian-border); }
        .drawing-table td { padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--obsidian-border); }

        .rev-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 3px; font-weight: 800; font-size: 0.75rem; }
        .rev-badge.latest { background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid #388e3c; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--obsidian-card); border: 1px solid var(--obsidian-border); border-top: 3px solid var(--allcon-red); width: 100%; max-width: 500px; border-radius: 6px; padding: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; }
        .form-input { width: 100%; padding: 0.6rem 0.8rem; background: var(--input-bg); border: 1px solid var(--obsidian-border); color: white; border-radius: 4px; outline: none; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; }
        .btn-save { background: var(--allcon-red); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; font-weight: 700; cursor: pointer; }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--obsidian-border); padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div>
                <strong style="font-size: 1.2rem;">ALLCON</strong>
                <span class="brand-subtitle"> | Drawing Revision Tracker</span>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div class="status-badge">
                    <span class="status-dot" id="connDot"></span>
                    <span id="connText">Disconnected</span>
                </div>
                <button class="btn-icon" onclick="promptSettingsPin()">⚙️ Server Config</button>
            </div>
        </div>
    </header>

    <main>
        <div class="summary-bar">
            <div class="metric-card alert">
                <div class="metric-label">New / Revised Drawings</div>
                <div class="metric-value" id="countRevised">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Monitored AFC Packages</div>
                <div class="metric-value" id="countProjects">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total AFC Drawings</div>
                <div class="metric-value" id="countTotalDrawings">0</div>
            </div>
        </div>

        <div id="projectContainer"></div>
    </main>

    <!-- CONFIG MODAL -->
    <div class="modal-overlay" id="configModal">
        <div class="modal-box">
            <h3 style="margin-bottom: 1rem; color: white;">Nextcloud WebDAV Settings</h3>
            <div class="form-group">
                <label>WebDAV Base URL</label>
                <input type="text" id="cfgUrl" class="form-input" placeholder="https://provider.com/remote.php/dav/files/user/">
            </div>
            <div class="form-group">
                <label>Root Watch Path</label>
                <input type="text" id="cfgPath" class="form-input" value="AllconData/Projects/Client/">
            </div>
            <div class="form-group">
                <label>Nextcloud Username</label>
                <input type="text" id="cfgUser" class="form-input">
            </div>
            <div class="form-group">
                <label>App Password / Token</label>
                <input type="password" id="cfgPass" class="form-input">
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeConfigModal()">Cancel</button>
                <button class="btn-save" onclick="saveConfiguration()">Sync Live Files</button>
            </div>
        </div>
    </div>

    <script>
        let config = {
            url: localStorage.getItem('nc_url') || '',
            path: localStorage.getItem('nc_path') || 'AllconData/Projects/Client/',
            user: localStorage.getItem('nc_user') || '',
            pass: localStorage.getItem('nc_pass') || '',
            pin: localStorage.getItem('nc_pin') || '1234'
        };

        let liveProjects = [];

        function promptSettingsPin() {
            const pin = prompt("Enter Security PIN:");
            if (pin === config.pin) {
                document.getElementById('cfgUrl').value = config.url;
                document.getElementById('cfgPath').value = config.path;
                document.getElementById('cfgUser').value = config.user;
                document.getElementById('cfgPass').value = config.pass;
                document.getElementById('configModal').classList.add('active');
            } else if (pin !== null) {
                alert("Incorrect PIN");
            }
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.remove('active');
        }

        function saveConfiguration() {
            let baseUrl = document.getElementById('cfgUrl').value.trim();
            if(!baseUrl.endsWith('/')) baseUrl += '/';

            config.url = baseUrl;
            config.path = document.getElementById('cfgPath').value.trim();
            config.user = document.getElementById('cfgUser').value.trim();
            config.pass = document.getElementById('cfgPass').value.trim();

            localStorage.setItem('nc_url', config.url);
            localStorage.setItem('nc_path', config.path);
            localStorage.setItem('nc_user', config.user);
            localStorage.setItem('nc_pass', config.pass);

            closeConfigModal();
            fetchLiveNextcloudData();
        }

        function updateStatus(online, msg) {
            document.getElementById('connDot').className = `status-dot ${online ? 'online' : 'offline'}`;
            document.getElementById('connText').innerText = msg;
        }

        // LIVE WEBDAV CRAWLER
        async function fetchLiveNextcloudData() {
            if (!config.url || !config.user || !config.pass) {
                updateStatus(false, "Config Required");
                return;
            }

            updateStatus(false, "Indexing Nextcloud...");
            liveProjects = [];

            try {
                const rootTarget = config.url + encodeURI(config.path);
                await scanDirectoryRecursive(rootTarget);
                
                updateStatus(true, "Live Connected");
                renderDashboard();
            } catch (err) {
                console.error("WebDAV Sync Error:", err);
                updateStatus(false, "Sync Error (Check Credentials/CORS)");
            }
        }

        async function scanDirectoryRecursive(targetUrl) {
            const authHeader = 'Basic ' + btoa(config.user + ':' + config.pass);
            
            const response = await fetch(targetUrl, {
                method: 'PROPFIND',
                headers: {
                    'Authorization': authHeader,
                    'Depth': '1',
                    'Content-Type': 'application/xml'
                }
            });

            if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

            const text = await response.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, "text/xml");
            const responses = xmlDoc.getElementsByTagNameNS("DAV:", "response");

            let currentFolderFiles = [];
            let subFolders = [];

            for (let i = 0; i < responses.length; i++) {
                const href = responses[i].getElementsByTagNameNS("DAV:", "href")[0].textContent;
                const decodedHref = decodeURIComponent(href);
                
                // Skip the self target folder
                if (targetUrl.endsWith(decodedHref) || decodedHref.endsWith(encodeURI(targetUrl))) continue;

                const isCollection = responses[i].getElementsByTagNameNS("DAV:", "resourcetype")[0].getElementsByTagNameNS("DAV:", "collection").length > 0;
                const lastMod = responses[i].getElementsByTagNameNS("DAV:", "getlastmodified")[0]?.textContent || '';

                // EXCLUSION RULE: Skip Enquiry & RFQ Folders
                if (decodedHref.includes("Enquiry") || decodedHref.includes("RFQ") || decodedHref.includes("Tender")) {
                    continue; 
                }

                if (isCollection) {
                    subFolders.push(config.url.replace(/\/remote\.php.*/, '') + href);
                } else {
                    // TARGET RULE: Process drawing files ONLY within AFC paths
                    if ((decodedHref.includes("AFC") || decodedHref.includes("Approved For Construction")) && 
                       (decodedHref.endsWith(".pdf") || decodedHref.endsWith(".dwg"))) {
                        
                        const fileName = decodedHref.split('/').pop();
                        const revMatch = fileName.match(/(REV\s?\d+|REV[A-Z0-9_-]+)/i);
                        const revTag = revMatch ? revMatch[0].toUpperCase() : 'REV 00';

                        currentFolderFiles.push({
                            filename: fileName,
                            rev: revTag,
                            modified: lastMod ? new Date(lastMod).toLocaleDateString() : 'Recent',
                            rawDate: new Date(lastMod || Date.now())
                        });
                    }
                }
            }

            if (currentFolderFiles.length > 0) {
                // Determine clean display title from path
                const pathParts = targetUrl.split('/');
                const clientProjectName = pathParts.slice(-4, -1).filter(p => p && !p.includes('remote.php')).join(' > ');

                liveProjects.push({
                    path: targetUrl.replace(config.url, ''),
                    projectName: clientProjectName || "AFC Drawings Package",
                    drawings: currentFolderFiles
                });
            }

            // Recurse into valid subfolders
            for (let folderUrl of subFolders) {
                await scanDirectoryRecursive(folderUrl);
            }
        }

        function renderDashboard() {
            const container = document.getElementById('projectContainer');
            container.innerHTML = '';

            if (liveProjects.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 3rem; color: var(--text-muted);">No AFC Drawing Packages found yet. Ensure folders are named with 'AFC' and contain .pdf files.</div>`;
                return;
            }

            let totalDrawings = 0;

            liveProjects.forEach(p => {
                totalDrawings += p.drawings.length;

                let drawingsHtml = p.drawings.map(d => `
                    <tr>
                        <td><strong>${d.filename}</strong></td>
                        <td><span class="rev-badge latest">${d.rev}</span></td>
                        <td>${d.modified}</td>
                        <td><strong style="color:#81c784;">AFC VERIFIED</strong></td>
                    </tr>
                `).join('');

                container.innerHTML += `
                    <div class="project-card">
                        <div class="project-header">
                            <div>
                                <div class="project-path">${p.path}</div>
                                <div class="project-name">${p.projectName}</div>
                            </div>
                            <span class="alert-tag" style="background:#2e7d32;">AFC Filtered</span>
                        </div>
                        <table class="drawing-table">
                            <thead>
                                <tr>
                                    <th>AFC Drawing File</th>
                                    <th>Revision</th>
                                    <th>Last Modified</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>${drawingsHtml}</tbody>
                        </table>
                    </div>
                `;
            });

            document.getElementById('countProjects').innerText = liveProjects.length;
            document.getElementById('countTotalDrawings').innerText = totalDrawings;
        }

        window.onload = function() {
            if (config.url) {
                fetchLiveNextcloudData();
            } else {
                updateStatus(false, "Config Required");
            }
        };
    </script>
</body>
</html>
